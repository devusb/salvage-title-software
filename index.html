<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Salvage Title Software</title>
    <link rel="stylesheet" href="node_modules/reveal.js/dist/reset.css" />
    <link rel="stylesheet" href="node_modules/reveal.js/dist/reveal.css" />
    <link rel="stylesheet" href="node_modules/reveal.js/dist/theme/black.css" />
    <link rel="stylesheet" href="node_modules/reveal.js/plugin/highlight/monokai.css" />
    <style>
      .reveal h1 {
        font-size: 1.6em;
        text-transform: none;
      }
      .reveal h2 {
        font-size: 0.9em;
        text-transform: none;
        margin-bottom: 0.8em;
      }
      .reveal h3 {
        text-transform: none;
      }
      .reveal pre code {
        font-size: 0.55em;
        line-height: 1.4;
      }
      .reveal .placeholder {
        border: 2px dashed #888;
        color: #aaa;
        font-size: 0.45em;
        font-family: monospace;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0.5em;
        margin: 0 auto;
      }
      .reveal .method {
        text-align: left;
        font-size: 0.65em;
      }
      .reveal .method p {
        margin: 0.4em 0;
      }
      .reveal .method .why {
        opacity: 0.75;
        font-style: italic;
      }
      .reveal .eyebrow {
        font-size: 0.5em;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        opacity: 0.6;
        margin: 0.4em 0 0.2em 0;
      }
      .reveal ul.gap {
        display: inline-block;
        text-align: left;
        font-size: 0.8em;
        margin: 0;
      }
      .reveal ul.gap li {
        margin-bottom: 0.4em;
      }
    </style>
  </head>
  <body>
    <div class="reveal">
      <div class="slides">
        <section data-markdown="slides/00-title.md" data-separator="^\n---\n$" data-separator-vertical="^\n----\n$" data-separator-notes="^Note:"></section>
        <section data-markdown="slides/01-father-in-law.md" data-separator="^\n---\n$" data-separator-vertical="^\n----\n$" data-separator-notes="^Note:"></section>
        <section data-markdown="slides/02-pivot.md" data-separator="^\n---\n$" data-separator-vertical="^\n----\n$" data-separator-notes="^Note:"></section>
        <section data-markdown="slides/03-bin.md" data-separator="^\n---\n$" data-separator-vertical="^\n----\n$" data-separator-notes="^Note:"></section>
        <section data-markdown="slides/04-language.md" data-separator="^\n---\n$" data-separator-vertical="^\n----\n$" data-separator-notes="^Note:"></section>
        <section data-markdown="slides/05-container.md" data-separator="^\n---\n$" data-separator-vertical="^\n----\n$" data-separator-notes="^Note:"></section>
        <section data-markdown="slides/06-skills.md" data-separator="^\n---\n$" data-separator-vertical="^\n----\n$" data-separator-notes="^Note:"></section>
        <section data-markdown="slides/07-take-stock.md" data-separator="^\n---\n$" data-separator-vertical="^\n----\n$" data-separator-notes="^Note:"></section>
        <section data-markdown="slides/08-close.md" data-separator="^\n---\n$" data-separator-vertical="^\n----\n$" data-separator-notes="^Note:"></section>
      </div>
    </div>
    <script src="node_modules/reveal.js/dist/reveal.js"></script>
    <script src="node_modules/reveal.js/plugin/markdown/markdown.js"></script>
    <script src="node_modules/reveal.js/plugin/highlight/highlight.js"></script>
    <script src="node_modules/reveal.js/plugin/notes/notes.js"></script>
    <script>
      const practice = new URLSearchParams(location.search).has("practice");

      Reveal.initialize({
        hash: true,
        defaultTiming: 15,
        plugins: [RevealMarkdown, RevealHighlight, RevealNotes],
      });

      if (practice) {
        const budget = () => parseInt(Reveal.getCurrentSlide().dataset.timing || Reveal.getConfig().defaultTiming, 10);
        let timer = null;
        let paused = false;
        let pausedAt = 0;
        let slideStart = 0;
        let runStart = 0;
        const log = [];
        const audio = new (window.AudioContext || window.webkitAudioContext)();
        document.addEventListener("keydown", () => audio.resume(), { once: true });
        document.addEventListener("click", () => audio.resume(), { once: true });

        function tick() {
          const osc = audio.createOscillator();
          const gain = audio.createGain();
          osc.frequency.value = 880;
          gain.gain.setValueAtTime(0.08, audio.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.12);
          osc.connect(gain).connect(audio.destination);
          osc.start();
          osc.stop(audio.currentTime + 0.12);
        }

        function label(slide) {
          const h = slide.querySelector("h1, h2, h3");
          if (h) return h.textContent.trim().slice(0, 28);
          const p = slide.querySelector(".placeholder");
          return p ? p.textContent.trim().replace(/\s+/g, " ").slice(0, 28) : "(untitled)";
        }

        const current = () => log[log.length - 1];

        function enter() {
          slideStart = performance.now();
          if (!runStart) runStart = slideStart;
          log.push({ i: Reveal.getIndices().h + 1, label: label(Reveal.getCurrentSlide()), budget: budget(), spoke: null, overran: false });
          cue();
        }

        function cue() {
          clearTimeout(timer);
          if (paused) return;
          const remaining = Math.max(0, budget() * 1000 - (performance.now() - slideStart));
          if (Reveal.isLastSlide()) {
            timer = setTimeout(report, remaining);
            return;
          }
          timer = setTimeout(() => {
            const c = current();
            if (c && c.spoke === null) c.overran = true;
            tick();
            Reveal.next();
          }, remaining);
        }

        function mark() {
          const since = (performance.now() - slideStart) / 1000;
          const c = current();
          const prev = log[log.length - 2];
          if (c && c.spoke === null && prev && prev.overran && prev.spoke === null && since < 4) {
            prev.spoke = prev.budget + since;
          } else if (c) {
            c.spoke = since;
          }
        }

        function report() {
          clearTimeout(timer);
          const rows = log.map((r) => {
            const spoke = r.spoke === null ? (r.overran ? "ran past" : "no mark") : r.spoke.toFixed(1) + "s";
            const margin = r.spoke === null ? "" : (r.budget - r.spoke >= 0 ? "+" : "") + (r.budget - r.spoke).toFixed(1);
            const flag = r.spoke === null ? (r.overran ? "OVER" : "") : r.spoke > r.budget ? "OVER" : r.spoke > r.budget - 1.5 ? "tight" : "";
            return [String(r.i).padStart(2), r.label.padEnd(28), spoke.padStart(9), margin.padStart(6), flag].join("  ");
          });
          const marked = log.filter((r) => r.spoke !== null);
          const over = log.filter((r) => r.overran || (r.spoke !== null && r.spoke > r.budget)).length;
          const avg = marked.length ? marked.reduce((a, r) => a + r.spoke, 0) / marked.length : 0;
          const text = [
            "practice run  " + new Date().toISOString().slice(0, 16),
            "",
            " #  slide" + " ".repeat(25) + "spoke  margin",
            ...rows,
            "",
            log.length + " slides · " + marked.length + " marked · " + over + " over · avg " + avg.toFixed(1) + "s",
          ].join("\n");
          const pre = document.createElement("pre");
          pre.className = "practice-report";
          pre.style.cssText = "position:fixed;inset:5% 10%;overflow:auto;background:#111;color:#ddd;padding:1.5em;font:14px/1.4 monospace;z-index:60;border:1px solid #444;user-select:text";
          pre.textContent = text + "\n\n(select all, copy, paste it back)";
          document.body.appendChild(pre);
          console.log(text);
        }

        const hud = document.createElement("div");
        hud.style.cssText = "position:fixed;right:14px;bottom:10px;font:14px/1.35 monospace;color:#aaa;background:rgba(0,0,0,.55);padding:6px 10px;border-radius:4px;z-index:50;text-align:right;white-space:pre";
        const hudText = document.createElement("span");
        const restartBtn = document.createElement("button");
        restartBtn.textContent = "restart";
        restartBtn.style.cssText = "display:block;margin:6px 0 0 auto;font:12px monospace;background:#333;color:#ccc;border:1px solid #555;border-radius:3px;padding:2px 8px;cursor:pointer";
        restartBtn.onclick = () => { restartBtn.blur(); restart(); };
        hud.append(hudText, restartBtn);
        document.body.appendChild(hud);
        setInterval(() => {
          if (!log.length) return;
          const now = paused ? pausedAt : performance.now();
          const left = Math.max(0, budget() - (now - slideStart) / 1000);
          const total = (now - runStart) / 1000;
          const m = Math.floor(total / 60);
          const s = String(Math.floor(total % 60)).padStart(2, "0");
          const c = current();
          hudText.textContent =
            Reveal.getIndices().h + 1 + "/" + Reveal.getTotalSlides() + "  " + left.toFixed(1) + "s left" +
            "\n" + m + ":" + s + " elapsed" + (paused ? "  PAUSED" : "") + (c && c.spoke !== null ? "  marked" : "") +
            "\nM mark · P pause · R report · 0 restart";
        }, 100);

        function restart() {
          clearTimeout(timer);
          document.querySelectorAll("pre.practice-report").forEach((e) => e.remove());
          paused = false;
          document.body.style.outline = "";
          log.length = 0;
          runStart = 0;
          const atStart = Reveal.getIndices().h === 0 && Reveal.getIndices().v === 0;
          Reveal.slide(0, 0);
          if (atStart) enter();
        }

        Reveal.on("ready", enter);
        Reveal.on("slidechanged", enter);
        Reveal.addKeyBinding({ keyCode: 77, key: "M", description: "Mark end of narration" }, mark);
        Reveal.addKeyBinding({ keyCode: 82, key: "R", description: "Show practice report" }, report);
        Reveal.addKeyBinding({ keyCode: 48, key: "0", description: "Restart practice run" }, restart);
        Reveal.addKeyBinding({ keyCode: 80, key: "P", description: "Pause/resume practice timer" }, () => {
          if (paused) {
            const delta = performance.now() - pausedAt;
            slideStart += delta;
            runStart += delta;
          } else {
            pausedAt = performance.now();
          }
          paused = !paused;
          document.body.style.outline = paused ? "6px solid #c33" : "";
          cue();
        });
      }
    </script>
  </body>
</html>
